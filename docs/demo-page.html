<!-- demo-page.html — markup highlight sample (html / xml / svg / vue) -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Highlight demo</title>
    <link rel="stylesheet" href="demo-theme.css">
  </head>
  <body>
    <!-- a comment spanning context -->
    <header class="header" id="top">
      <h1>标题 Heading</h1>
      <img src="logo.svg" alt="logo" width="48" height="48">
    </header>
    <main>
      <p>普通段落 with <strong>bold</strong> and <em>italic</em>.</p>
      <table>
        <tr><th>键</th><th>值</th></tr>
        <tr><td>alpha</td><td>1</td></tr>
      </table>
    </main>
  </body>
</html>
